[project]
name = "ralph-loop"
version = "0.1.0"
description = "A small, inspectable RALPH loop runner for Codex and OpenCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ralph = "ralph_loop.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

