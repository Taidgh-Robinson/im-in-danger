[project]
name = "scissorhands"
version = "0.1.0"
description = "A small, inspectable agent loop runner for Claude Code, Codex, and OpenCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
scissorhands = "scissorhands.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "TID", "UP"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

